$kind: http-request
url: '{{base_url}}/api/itineraries'
method: POST
headers:
  Content-Type: application/json
  X-Editor-Id: editor-1
body:
  type: text
  content: |-
    {
      "title": "",
      "theme": "",
      "description": "Description without title or theme",
      "geographicalArea": "Tuscany"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });
      var jsonData = pm.response.json();
      pm.test('Contains validation errors', function () {
          pm.expect(jsonData.errors).to.be.an('array').that.is.not.empty;
      });
    language: text/javascript
order: 3000
