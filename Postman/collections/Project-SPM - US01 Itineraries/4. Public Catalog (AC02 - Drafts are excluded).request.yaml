$kind: http-request
url: '{{base_url}}/api/itineraries/public-catalog'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test('Draft itineraries do not appear in public catalog', function () {
          pm.expect(jsonData.length).to.eql(0);
      });
    language: text/javascript
order: 4000
