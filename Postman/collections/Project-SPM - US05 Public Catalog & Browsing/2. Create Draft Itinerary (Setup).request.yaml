$kind: http-request
url: "{{baseUrl}}/api/itineraries"
method: POST
headers:
  X-Editor-Id: "{{editorId}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Chianti Wine & Hills Tour",
      "theme": "Food & Wine",
      "description": "Scenic route connecting historical Tuscan wineries and stone villages.",
      "geographicalArea": "Chianti, Tuscany, Italy"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      var jsonData = pm.response.json();
      pm.collectionVariables.set("itineraryId", jsonData.id);
    language: text/javascript
order: 2000
