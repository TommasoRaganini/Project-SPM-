$kind: http-request
url: "{{baseUrl}}/api/itineraries/{{itineraryId}}/stops"
method: POST
headers:
  X-Editor-Id: "{{editorId}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Stop C",
      "description": "Description C",
      "latitude": 43,
      "longitude": 13
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Appended at position 3", () => pm.expect(pm.response.json().position).to.eql(3));
      pm.collectionVariables.set("stopC", pm.response.json().id);
      const { position, ...details } = pm.response.json();
      pm.collectionVariables.set("detailsC", JSON.stringify(details));
    language: text/javascript
order: 4000
