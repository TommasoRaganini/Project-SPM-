$kind: http-request
url: "{{baseUrl}}/api/itineraries/{{itineraryId}}/stops/order"
method: PUT
headers:
  X-Editor-Id: "{{editorId}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "stopIds": [
        "{{stopA}}",
        "{{stopA}}",
        "{{stopB}}"
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
