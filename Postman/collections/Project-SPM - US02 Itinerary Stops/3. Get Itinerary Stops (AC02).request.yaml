$kind: http-request
url: http://localhost:5207/api/itineraries/{{itinerary_id}}/stops
method: GET
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Stops collection is not empty', function () {
          pm.expect(jsonData.length).to.be.above(0);
      });
    language: text/javascript
order: 3000
